# ===================================
#  Field Definitions
# ===================================

fields:

    category:
        label: aic.faq::lang.models.category.label
        type: relation
        emptyOption: aic.faq::lang.models.general.none_options

    question:
        label: aic.faq::lang.models.faq.question
        type: textarea
        size: tiny

    answer:
        label: aic.faq::lang.models.faq.answer
        type: richeditor
        size: giant
        toolbarButtons: bold|italic|underline|||subscript|superscript|||emoticons|||formatOL|formatUL|||insertLink|insertImage|insertVideo|insertFile|||undo|redo|||html|||

secondaryTabs:
    fields:

        is_published:
            label: aic.faq::lang.models.general.published_status.title
            type: balloon-selector
            options:
                1: aic.faq::lang.models.general.published_status.published
                2: aic.faq::lang.models.general.published_status.in_draft
                0: aic.faq::lang.models.general.published_status.not_published
            default: 1

        is_featured:
            label: aic.faq::lang.models.general.featured_status.title
            type: balloon-selector
            options:
                1: aic.faq::lang.models.general.featured_status.featured
                0: aic.faq::lang.models.general.featured_status.not_featured
            default: 0
