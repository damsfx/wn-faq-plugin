{% if faqsPerCategory | length > 0 %}
    {% for categoryName, faqsInCategory in faqsPerCategory %}
        <div class="faq-category">
            <h2>{{ categoryName }}</h2>
            <ul>
            {% for faq in faqsInCategory %}
                <li>
                    <details>
                        <summary><span>{{ faq.question }}</span></summary>
                        <div>{{ faq.answer | raw }}</div>
                    </details>
                </li>
            {% endfor %}
            </ul>
        </div>
    {% endfor %}
{% else %}
    <p class='no-faqs-message'>{{ __SELF__.noFaqsMessage }}</p>
{% endif %}
